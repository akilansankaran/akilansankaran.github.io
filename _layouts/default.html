<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar">
      <a href="/" class="nav-brand">Akilan Sankaran</a>
      <div class="nav-links">
        <a href="/research">Research</a>
        <a href="/coursework">Background</a>
        <a href="/music">Music</a>
        <a href="https://www.youtube.com/channel/UC3BUUIJfTgrYauJq0PTKlng" target="_blank" rel="noopener noreferrer" class="nav-hide-mobile">YouTube</a>
        <a href="mailto:akilansankaran@college.harvard.edu">Email</a>
        <a href="https://linkedin.com/in/akilan-sankaran/" target="_blank" rel="noopener noreferrer" class="nav-hide-mobile">LinkedIn</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark mode">🌙</button>
      </div>
    </nav>
    <main class="container">
      {{ content }}
    </main>
    <script>
      const themeToggle = document.getElementById('theme-toggle');
      const html = document.documentElement;

      const currentTheme = localStorage.getItem('theme') || 'light';
      html.setAttribute('data-theme', currentTheme);
      updateThemeIcon(currentTheme);

      themeToggle.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeIcon(next);
      });

      function updateThemeIcon(theme) {
        themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
      }
    </script>
  </body>
</html>
